[tool.black]
line-length = 120
target-version = ["py312"]
include = "\\.pyi?$"
exclude = """
/(\
    \\.git
  | \\.mypy_cache
  | \\.ruff_cache
  | \\.venv
  | build
  | dist
  | data
  | exports
  | logs
  | __pycache__
)/
"""

[tool.isort]
profile = "black"
line_length = 120
force_single_line = false
combine_as_imports = true
known_first_party = []
include_trailing_comma = true
skip_gitignore = true

[tool.ruff]
line-length = 120
target-version = "py312"
respect-gitignore = true
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "data",
  "exports",
  "logs",
  "__pycache__",
  "docs",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort imports
  "N",    # pep8-naming
  "W",    # pycodestyle warnings
  "D",    # pydocstyle
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations
  "B",    # bugbear
  "A",    # flake8-builtins
  "COM",  # flake8-commas
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "T10",  # flake8-debugger
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "ISC",  # flake8-implicit-str-concat
  "ICN",  # flake8-import-conventions
  "G",    # flake8-logging-format
  "INP",  # flake8-no-pep420
  "PIE",  # flake8-pie
  "PYI",  # flake8-pyi
  "PT",   # flake8-pytest-style
  "Q",    # flake8-quotes
  "RSE",  # flake8-raise
  "RET",  # flake8-return
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "TCH",  # flake8-type-checking
  "INT",  # flake8-gettext
  "ARG",  # flake8-unused-arguments
  "PTH",  # flake8-use-pathlib
  "PL",   # pylint-inspired
  "TRY",  # tryceratops
  "FLY",  # flynt
  "PERF", # perflint
  "FURB", # refurb
  "RUF",  # ruff-specific
]
ignore = [
  # Docstring rules - too strict for existing codebase
  "D100", # Missing docstring in public module
  "D101", # Missing docstring in public class
  "D102", # Missing docstring in public method
  "D103", # Missing docstring in public function
  "D104", # Missing docstring in public package
  "D105", # Missing docstring in magic method
  "D106", # Missing docstring in public nested class
  "D107", # Missing docstring in __init__
  # Annotation rules - too strict for existing codebase
  "ANN101", # Missing type annotation for self in method
  "ANN102", # Missing type annotation for cls in classmethod
  "ANN401", # Dynamically typed expressions (Any) are disallowed
  # Complexity rules
  "PLR0913", # Too many arguments
  "PLR0915", # Too many statements
  "PLR2004", # Magic value used in comparison
  # Try rules - too strict for existing codebase
  "TRY003", # Avoid specifying long messages outside the exception class
  "TRY300", # Consider moving this statement to an else block
  "TRY301", # Abstract raise to an inner function
  "TRY400", # Use logging.exception instead of logging.error
  "TRY401", # Redundant exception object
  # Formatter conflicts
  "COM812", # Trailing comma missing (conflicts with formatter)
  "COM819", # Trailing comma prohibited (conflicts with formatter)
  "ISC001", # Single-line implicit string concatenation (conflicts with formatter)
  "ISC002", # Multi-line implicit string concatenation (conflicts with formatter)
  # Other conflicts
  "E203", # Whitespace before ':' (black compatible)
  "E501", # Line length handled by formatter
  # Docstring formatting - too strict for existing codebase
  "D205", # 1 blank line required between summary line and description
  "D400", # First line should end with a period
  "D415", # First line should end with a period, question mark, or exclamation point
  # Path operations - existing code uses open() extensively
  "PTH123", # open() should be replaced by Path.open()
  # Shebang - scripts don't need to be executable in all contexts
  "EXE001", # Shebang is present but file is not executable
  # Logging - existing code uses error with exc_info
  "G201", # Logging .exception(...) should be used instead of .error(..., exc_info=True)
  # Ambiguous characters
  "RUF002", # Docstring contains ambiguous character
  # Annotations - too many missing in existing codebase
  "ANN001", # Missing type annotation for function argument
  "ANN201", # Missing return type annotation for public function
  "ANN202", # Missing return type annotation for private function
  "ANN002", # Missing type annotation for *args
  # Naming conventions - existing code uses conventions that conflict
  "N806", # Variable in function should be lowercase (UPPER_CASE constants)
  "N802", # Function name should be lowercase (FIX API callbacks)
  "N803", # Argument name should be lowercase (FIX API callbacks)
  # Private member access
  "SLF001", # Private member accessed
  # Ambiguous characters (greek letters, etc.)
  "RUF001", # String contains ambiguous character
  # Complexity rules
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  # Naive datetime - existing code uses naive datetimes
  "DTZ003", # datetime.datetime.utcnow() used
  "DTZ007", # Naive datetime constructed using strptime without %z
  # Path operations - existing code uses os module
  "PTH105", # os.replace() should be replaced by Path.replace()
  "PTH108", # os.unlink() should be replaced by Path.unlink()
  # Docstring style - too strict for existing codebase
  "D401", # First line of docstring should be in imperative mood
  "D417", # Missing argument description in the docstring
  # Ambiguous characters in comments (greek letters, etc.)
  "RUF003", # Comment contains ambiguous character
  "RUF005", # Collection literal concatenate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "PLR2004", # Magic numbers are fine in test assertions
  "PLC0415", # Local imports inside test helpers are intentional
  "E402",    # sys.path manipulation before project imports in test fixtures
  "ANN001",  # Missing type annotation for function argument
  "ANN201",  # Missing return type annotation for public function
  "ANN202",  # Missing return type annotation for private function
  "ARG001",  # Unused function argument
  "ARG002",  # Unused method argument
  "S101",    # Use of assert detected
  "D",       # All docstring rules
  "SLF001",  # Private member access
]
"scripts/**" = [
  "E402",    # sys.path.insert before src imports is the scripts pattern
  "PLC0415", # Lazy/conditional imports inside script functions
  "INP001",  # Implicit namespace package
]
"docs/**" = [
  "INP001", # Implicit namespace package
  "A001",   # Variable shadowing builtin
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"
addopts = "-q --tb=short --no-header"

[tool.coverage.run]
source = ["src"]
omit = ["src/core/ctrader_ddqn_paper.py", "src/_archived/*"]
parallel = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
show_error_codes = true
allow_redefinition = false
plugins = []
